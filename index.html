<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2:wght@300;400&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: 'Exo 2', sans-serif; }
        #ui { position: absolute; top: 24px; left: 24px; color: #fff; pointer-events: none; z-index: 10; }
        #ui h1 { font-family: 'Orbitron', monospace; font-size: 1.1rem; font-weight: 700; letter-spacing: 0.2em; color: #ffcc55; text-shadow: 0 0 20px #ff8800, 0 0 40px #ff4400; margin-bottom: 6px; }
        #ui p { font-size: 0.72rem; color: rgba(255,255,255,0.45); letter-spacing: 0.08em; }
        #tooltip { position: absolute; pointer-events: none; background: rgba(0,0,0,0.75); border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; padding: 10px 16px; color: white; font-size: 0.85rem; backdrop-filter: blur(10px); display: none; z-index: 20; }
        #tooltip h3 { font-family: 'Orbitron', monospace; font-size: 0.9rem; margin-bottom: 4px; }
        #tooltip p { color: rgba(255,255,255,0.6); font-size: 0.75rem; }
        #speed-control { position: absolute; bottom: 24px; right: 24px; color: white; z-index: 10; text-align: right; }
        #speed-control label { font-size: 0.72rem; letter-spacing: 0.1em; color: rgba(255,255,255,0.5); display: block; margin-bottom: 6px; }
        #speed-slider { -webkit-appearance: none; width: 140px; height: 3px; border-radius: 2px; background: linear-gradient(to right, #ff8800, #ffcc00); outline: none; cursor: pointer; }
        #speed-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #ffcc55; box-shadow: 0 0 8px #ff8800; cursor: pointer; }

        /* Hidden asset images */
        #assets { display: none; }
    </style>
</head>
<body>

    <!-- ═══ Image Assets ══════════════════════════════════════════════════════ -->
    <div id="assets">
        <img id="tex-sun"          src="2k_sun.jpg"               crossorigin="anonymous">
        <img id="tex-mercury"      src="2k_mercury.jpg"           crossorigin="anonymous">
        <img id="tex-venus"        src="2k_venus_surface.jpg"     crossorigin="anonymous">
        <img id="tex-earth"        src="2k_earth_daymap.jpg"      crossorigin="anonymous">
        <img id="tex-earth-spec"   src="2k_earth_specular_map.jpg" crossorigin="anonymous">
        <img id="tex-earth-clouds" src="2k_earth_clouds.jpg"      crossorigin="anonymous">
        <img id="tex-earth-night"  src="2k_earth_nightmap.jpg"    crossorigin="anonymous">
        <img id="tex-mars"         src="2k_mars.jpg"              crossorigin="anonymous">
        <img id="tex-jupiter"      src="2k_jupiter.jpg"           crossorigin="anonymous">
        <img id="tex-saturn"       src="2k_saturn.jpg"            crossorigin="anonymous">
        <img id="tex-saturn-ring"  src="2k_saturn_ring_alpha.png" crossorigin="anonymous">
        <img id="tex-uranus"       src="2k_uranus.jpg"            crossorigin="anonymous">
        <img id="tex-neptune"      src="2k_neptune.jpg"           crossorigin="anonymous">
        <img id="tex-pluto"        src="2k_pluto.jpg"             crossorigin="anonymous">
    </div>

    <div id="ui">
        <h1>☀ SOLAR SYSTEM</h1>
        <p>DRAG · SCROLL · HOVER</p>
    </div>
    <div id="tooltip"><h3 id="tt-name"></h3><p id="tt-info"></p></div>
    <div id="speed-control">
        <label>ORBIT SPEED</label>
        <input type="range" id="speed-slider" min="0" max="5" step="0.1" value="1">
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
    // ── Wait for all asset <img> tags to load, then kick off Three.js ────────────
    function waitAll() {
        const imgs = Array.from(document.querySelectorAll('#assets img'));
        return Promise.all(imgs.map(img =>
            new Promise(res => {
                if (img.complete && img.naturalWidth > 0) res();
                else { img.onload = res; img.onerror = res; }
            })
        ));
    }

    // ── Build a THREE.Texture from an already-loaded <img> by its element id ─────
    function tex(id) {
        const el = document.getElementById(id);
        if (!el || el.naturalWidth === 0) {
            console.warn('Missing or unloaded texture:', id);
            return new THREE.Texture();
        }
        const t = new THREE.Texture(el);
        t.needsUpdate = true;
        return t;
    }

    waitAll().then(init);

    function init() {

        // ── Renderer ──────────────────────────────────────────────────────────
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(innerWidth, innerHeight);
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        document.body.appendChild(renderer.domElement);

        // ── Scene & Camera ────────────────────────────────────────────────────
        const scene  = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 5000);
        camera.position.set(0, 160, 320);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.minDistance   = 30;
        controls.maxDistance   = 800;

        // ── Lights ────────────────────────────────────────────────────────────
        scene.add(new THREE.AmbientLight(0x111133, 0.6));
        const sunLight = new THREE.PointLight(0xfff0cc, 3.5, 1500);
        scene.add(sunLight);
        const fill = new THREE.PointLight(0x2244aa, 0.4, 800);
        fill.position.set(-200, 50, -100);
        scene.add(fill);

        // ── Sun ───────────────────────────────────────────────────────────────
        const sunMesh = new THREE.Mesh(
            new THREE.SphereGeometry(15, 64, 64),
            new THREE.MeshBasicMaterial({ map: tex('tex-sun') })
        );
        scene.add(sunMesh);

        function addGlow(r, color, opacity) {
            const m = new THREE.Mesh(
                new THREE.SphereGeometry(r, 32, 32),
                new THREE.MeshBasicMaterial({ color, transparent: true, opacity, side: THREE.BackSide, blending: THREE.AdditiveBlending })
            );
            scene.add(m); return m;
        }
        const glow1 = addGlow(18.5, 0xff6600, 0.35);
        const glow2 = addGlow(22,   0xff3300, 0.18);
        const glow3 = addGlow(27,   0xff1100, 0.07);

        // ── Stars ─────────────────────────────────────────────────────────────
        (function() {
            const n = 12000, pos = new Float32Array(n*3), col = new Float32Array(n*3);
            const palette = [[1,1,1],[0.9,0.95,1],[1,0.95,0.85],[0.85,0.9,1],[1,0.8,0.8]];
            for (let i = 0; i < n; i++) {
                const r = 600 + Math.random()*1400, th = Math.random()*Math.PI*2, ph = Math.acos(2*Math.random()-1);
                pos[i*3]=r*Math.sin(ph)*Math.cos(th); pos[i*3+1]=r*Math.sin(ph)*Math.sin(th); pos[i*3+2]=r*Math.cos(ph);
                const c = palette[Math.floor(Math.random()*palette.length)];
                col[i*3]=c[0]; col[i*3+1]=c[1]; col[i*3+2]=c[2];
            }
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geo.setAttribute('color',    new THREE.BufferAttribute(col, 3));
            scene.add(new THREE.Points(geo, new THREE.PointsMaterial({ size: 0.9, vertexColors: true })));
        })();

        // ── Planets ───────────────────────────────────────────────────────────
        const planetData = [
            { name:'Mercury', dist:30,  r:1.2, spd:0.047,  tid:'tex-mercury',  emissive:0x221100, atmo:null,      info:'Closest to the Sun · No atmosphere · Extreme temps' },
            { name:'Venus',   dist:42,  r:1.9, spd:0.018,  tid:'tex-venus',    emissive:0x332200, atmo:0xFFCC88, info:'Hottest planet · Thick toxic atmosphere · Retrograde spin' },
            { name:'Earth',   dist:57,  r:2.1, spd:0.010,  tid:'tex-earth',    emissive:0x001122, atmo:0x4488FF, info:'Our home · 71% ocean · Only known life in solar system', isEarth:true },
            { name:'Mars',    dist:73,  r:1.6, spd:0.008,  tid:'tex-mars',     emissive:0x220800, atmo:0xFF8844, info:'The Red Planet · Tallest volcano in solar system' },
            { name:'Jupiter', dist:105, r:6.0, spd:0.004,  tid:'tex-jupiter',  emissive:0x110800, atmo:null,      info:'Largest planet · Great Red Spot storm · 95 moons' },
            { name:'Saturn',  dist:138, r:5.0, spd:0.002,  tid:'tex-saturn',   emissive:0x110900, atmo:null,      info:'Lord of the Rings · Least dense planet', hasRings:true },
            { name:'Uranus',  dist:168, r:3.2, spd:0.0015, tid:'tex-uranus',   emissive:0x001111, atmo:0x88DDEE, info:'Ice giant · Rotates on its side · −224°C' },
            { name:'Neptune', dist:194, r:3.0, spd:0.001,  tid:'tex-neptune',  emissive:0x000822, atmo:0x2244FF, info:'Windiest planet · 2100 km/h storms · 14 moons' },
            { name:'Pluto',   dist:220, r:0.9, spd:0.0007, tid:'tex-pluto',    emissive:0x110808, atmo:null,      info:'Dwarf planet · Heart-shaped nitrogen ice plain' },
        ];

        const planetMeshes = [];
        let earthClouds = null;

        const orbitHues = [0.08,0.13,0.55,0.02,0.07,0.12,0.52,0.62,0.72];

        planetData.forEach((d, i) => {
            const pivot = new THREE.Object3D();
            pivot.rotation.y = Math.random() * Math.PI * 2;
            scene.add(pivot);

            let mesh;

            if (d.isEarth) {
                mesh = new THREE.Mesh(
                    new THREE.SphereGeometry(d.r, 64, 64),
                    new THREE.MeshPhongMaterial({
                        map:         tex('tex-earth'),
                        specularMap: tex('tex-earth-spec'),
                        specular:    new THREE.Color(0x4488aa),
                        shininess:   60,
                    })
                );
                mesh.position.x = d.dist;
                pivot.add(mesh);

                // Night lights
                const nt = tex('tex-earth-night');
                mesh.add(new THREE.Mesh(
                    new THREE.SphereGeometry(d.r + 0.02, 64, 64),
                    new THREE.MeshLambertMaterial({ map:nt, emissiveMap:nt, emissive:new THREE.Color(0xffcc66), emissiveIntensity:1.2, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false })
                ));

                // Clouds
                const ct = tex('tex-earth-clouds');
                earthClouds = new THREE.Mesh(
                    new THREE.SphereGeometry(d.r * 1.015, 64, 64),
                    new THREE.MeshPhongMaterial({ map:ct, alphaMap:ct, transparent:true, opacity:0.88, depthWrite:false })
                );
                mesh.add(earthClouds);

                // Atmosphere
                [[d.r*1.06,0x1a6edb,0.18],[d.r*1.12,0x0044aa,0.10],[d.r*1.20,0x002266,0.04]].forEach(([r,c,o]) => {
                    mesh.add(new THREE.Mesh(new THREE.SphereGeometry(r,48,48), new THREE.MeshBasicMaterial({ color:c, transparent:true, opacity:o, side:THREE.BackSide, blending:THREE.AdditiveBlending, depthWrite:false })));
                });

            } else {
                mesh = new THREE.Mesh(
                    new THREE.SphereGeometry(d.r, 48, 48),
                    new THREE.MeshPhongMaterial({
                        map:              tex(d.tid),
                        emissive:         new THREE.Color(d.emissive),
                        emissiveIntensity: 0.3,
                        shininess:        15,
                        specular:         new THREE.Color(0x222222),
                    })
                );
                mesh.position.x = d.dist;
                pivot.add(mesh);

                if (d.atmo) {
                    mesh.add(new THREE.Mesh(new THREE.SphereGeometry(d.r*1.12,32,32), new THREE.MeshBasicMaterial({ color:d.atmo, transparent:true, opacity:0.22, side:THREE.BackSide, blending:THREE.AdditiveBlending })));
                }
            }

            // Saturn rings
            if (d.hasRings) {
                const innerR = d.r + 1.8, outerR = d.r + 8;
                const rg = new THREE.RingGeometry(innerR, outerR, 128);
                const rp = rg.attributes.position, ru = rg.attributes.uv;
                for (let j = 0; j < rp.count; j++) {
                    const rx = rp.getX(j), ry = rp.getY(j);
                    ru.setX(j, (Math.sqrt(rx*rx+ry*ry) - innerR) / (outerR - innerR));
                    ru.setY(j, 0);
                }
                const rm = new THREE.Mesh(rg, new THREE.MeshBasicMaterial({ map:tex('tex-saturn-ring'), side:THREE.DoubleSide, transparent:true, opacity:0.88 }));
                rm.rotation.x = Math.PI / 2.3;
                mesh.add(rm);
            }

            // Orbit line
            const pts = [];
            for (let j = 0; j <= 360; j++) { const a = j/360*Math.PI*2; pts.push(new THREE.Vector3(Math.cos(a)*d.dist, 0, Math.sin(a)*d.dist)); }
            scene.add(new THREE.Line(
                new THREE.BufferGeometry().setFromPoints(pts),
                new THREE.LineBasicMaterial({ color: new THREE.Color().setHSL(orbitHues[i],0.75,0.55), transparent:true, opacity:0.55, blending:THREE.AdditiveBlending, depthWrite:false })
            ));

            planetMeshes.push({ pivot, mesh, spd: d.spd, data: d });
        });

        // ── Asteroid belt ─────────────────────────────────────────────────────
        (function() {
            const n = 2000, pos = new Float32Array(n*3);
            for (let i = 0; i < n; i++) {
                const a = Math.random()*Math.PI*2, r = 82+(Math.random()-0.5)*12;
                pos[i*3]=Math.cos(a)*r; pos[i*3+1]=(Math.random()-0.5)*4; pos[i*3+2]=Math.sin(a)*r;
            }
            const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
            scene.add(new THREE.Points(geo, new THREE.PointsMaterial({ size:0.4, color:0x997755 })));
        })();

        // ── Tooltip ───────────────────────────────────────────────────────────
        const raycaster = new THREE.Raycaster(), mouse = new THREE.Vector2();
        const tooltip = document.getElementById('tooltip');
        window.addEventListener('mousemove', e => {
            mouse.x = (e.clientX/innerWidth)*2-1;
            mouse.y = -(e.clientY/innerHeight)*2+1;
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(planetMeshes.map(p=>p.mesh));
            if (hits.length) {
                const pd = planetMeshes.find(p=>p.mesh===hits[0].object);
                if (pd) {
                    document.getElementById('tt-name').textContent = pd.data.name;
                    document.getElementById('tt-info').textContent = pd.data.info;
                    tooltip.style.display = 'block';
                    tooltip.style.left = (e.clientX+16)+'px';
                    tooltip.style.top  = (e.clientY-20)+'px';
                }
            } else { tooltip.style.display = 'none'; }
        });

        // ── Speed slider ──────────────────────────────────────────────────────
        let speedMult = 1;
        document.getElementById('speed-slider').addEventListener('input', e => { speedMult = parseFloat(e.target.value); });

        // ── Resize ────────────────────────────────────────────────────────────
        window.addEventListener('resize', () => {
            camera.aspect = innerWidth/innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
        });

        // ── Animate ───────────────────────────────────────────────────────────
        let t = 0;
        (function animate() {
            requestAnimationFrame(animate);
            t += 0.016;

            sunMesh.rotation.y += 0.003;
            const pulse = 1 + Math.sin(t*2.1)*0.05 + Math.sin(t*3.7)*0.03;
            glow1.scale.setScalar(pulse);
            glow2.scale.setScalar(1+Math.sin(t*1.8)*0.07);
            glow3.scale.setScalar(1+Math.sin(t*1.2)*0.10);
            glow1.material.opacity = 0.3+Math.sin(t*2.5)*0.08;

            planetMeshes.forEach(p => {
                p.pivot.rotation.y += p.spd * speedMult * 0.5;
                p.mesh.rotation.y  += 0.012;
            });
            if (earthClouds) earthClouds.rotation.y += 0.0018;

            controls.update();
            renderer.render(scene, camera);
        })();
    }
    </script>
</body>
</html>
